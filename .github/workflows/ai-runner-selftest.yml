name: MGnarfTest AI runner selftest

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  ai-runner-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate AI scenarios
        run: python3 tools/validate_ai_behavior.py

      - name: Compile AI runner, evidence verifier, readiness gate and provider adapters
        run: |
          python3 -m py_compile \
            tools/ai_runner_protocol.py \
            tools/ai_runner_engine.py \
            tools/run_ai_behavior.py \
            tools/verify_ai_evidence.py \
            tools/check_ai_live_readiness.py \
            tools/test_run_ai_behavior.py \
            tools/test_verify_ai_evidence.py \
            tools/test_ai_live_readiness.py \
            tools/test_provider_adapters.py \
            adapters/provider_common.py \
            adapters/openai_adapter.py \
            adapters/gemini_adapter.py

      - name: Run AI runner, evidence-verifier and readiness unit tests
        run: |
          python3 -m unittest -v \
            tools.test_run_ai_behavior \
            tools.test_verify_ai_evidence \
            tools.test_ai_live_readiness \
            tools.test_provider_adapters
