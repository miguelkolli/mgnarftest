name: MGnarfTest registry validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "bootstrap/**", "dev/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact MGnarfTest subject commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: mgnarftest
          persist-credentials: false

      - name: Verify exact MGnarfTest subject SHA
        run: |
          test "$(git -C mgnarftest rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Python version
        run: python3 --version

      - name: Validate registry manifests
        working-directory: mgnarftest
        run: python3 tools/validate_registry.py

      - name: Compile registry tools and external tests
        working-directory: mgnarftest
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/validate_registry.py \
            tools/test_validate_registry.py \
            tools/prepare_targets.py \
            tools/test_prepare_targets.py \
            tools/run_registry.py \
            tools/test_run_registry.py \
            tools/generate_receipt.py \
            tools/verify_receipt.py \
            tools/verify_stable_promotion_pr.py \
            tools/test_verify_stable_promotion_pr.py
          find tests -type f -name 'test.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Test trusted control-plane verifiers
        working-directory: mgnarftest
        run: |
          python3 -m unittest -v \
            tools.test_validate_registry \
            tools.test_prepare_targets \
            tools.test_run_registry \
            tools.test_verify_stable_promotion_pr

      - name: Prepare exact MGnarf targets from runnable manifests
        working-directory: mgnarftest
        run: python3 tools/prepare_targets.py

      - name: Verify container runtime
        run: docker version --format '{{.Server.Version}}'

      - name: Run all runnable registry tests in isolated containers
        working-directory: mgnarftest
        env:
          MGNARFTEST_PYTHON_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: python3 tools/run_registry.py

      - name: Generate bound execution receipts
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MGNARFTEST_PYTHON_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: python3 tools/generate_receipt.py

      - name: Verify all bound execution receipts
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(evidence/*.json)
          test "${#receipts[@]}" -gt 0
          for receipt in "${receipts[@]}"; do
            python3 tools/verify_receipt.py "$receipt"
          done

      - name: Semantic result tamper must fail closed
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          receipt="$(find evidence -maxdepth 1 -type f -name '*.json' | sort | head -n 1)"
          test -n "$receipt"
          cp "$receipt" /tmp/result-tampered.json
          python3 - <<'PY'
          import hashlib
          import json
          p = '/tmp/result-tampered.json'
          d = json.load(open(p))
          d['execution']['result'] = 'LIMITATION_CONFIRMED'
          d.pop('receipt_sha256', None)
          canonical = json.dumps(d, sort_keys=True, separators=(',', ':')).encode()
          d['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          with open(p, 'w') as fh:
              json.dump(d, fh)
          PY
          if python3 tools/verify_receipt.py /tmp/result-tampered.json; then
            echo "Semantically invalid receipt result was accepted"
            exit 1
          fi
          echo "Semantically invalid receipt result rejected as required"

      - name: Timeout tamper must fail closed
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          receipt="$(find evidence -maxdepth 1 -type f -name '*.json' | sort | head -n 1)"
          test -n "$receipt"
          cp "$receipt" /tmp/timeout-tampered.json
          python3 - <<'PY'
          import json
          p = '/tmp/timeout-tampered.json'
          d = json.load(open(p))
          d['execution']['timeout_seconds'] = 999
          json.dump(d, open(p, 'w'))
          PY
          if python3 tools/verify_receipt.py /tmp/timeout-tampered.json; then
            echo "Tampered timeout receipt was accepted"
            exit 1
          fi
          echo "Tampered timeout receipt rejected as required"

      - name: Upload execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mgnarftest-evidence-${{ github.run_id }}
          path: mgnarftest/evidence/*.json
          if-no-files-found: error
          retention-days: 30
