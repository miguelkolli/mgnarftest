name: MGnarfTest registry validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "bootstrap/**", "dev/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact MGnarfTest subject commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: mgnarftest
          persist-credentials: false

      - name: Verify exact MGnarfTest subject SHA
        run: |
          test "$(git -C mgnarftest rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Checkout exact MGnarf v1.70 target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: miguelkolli/mgnarf
          ref: b811a13eab9cacd9f922b1f15097aa6bf700fc01
          path: target-mgnarf
          persist-credentials: false

      - name: Verify exact MGnarf target SHA
        run: |
          test "$(git -C target-mgnarf rev-parse HEAD)" = "b811a13eab9cacd9f922b1f15097aa6bf700fc01"

      - name: Python version
        run: python3 --version

      - name: Validate registry manifests
        working-directory: mgnarftest
        run: python3 tools/validate_registry.py

      - name: Compile registry tools and external tests
        working-directory: mgnarftest
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/validate_registry.py \
            tools/run_registry.py \
            tools/generate_receipt.py \
            tools/verify_receipt.py \
            tools/verify_promotion.py \
            tools/verify_pr_reviews.py
          find tests -type f -name 'test.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Verify container runtime
        run: docker version --format '{{.Server.Version}}'

      - name: Run all runnable registry tests in isolated containers
        working-directory: mgnarftest
        env:
          MGNARF_TARGET_SHA: b811a13eab9cacd9f922b1f15097aa6bf700fc01
          MGNARFTEST_PYTHON_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: python3 tools/run_registry.py

      - name: Generate bound execution receipts
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MGNARFTEST_PYTHON_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        run: python3 tools/generate_receipt.py

      - name: Verify all bound execution receipts
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          receipts=(evidence/*.json)
          test "${#receipts[@]}" -gt 0
          for receipt in "${receipts[@]}"; do
            python3 tools/verify_receipt.py "$receipt"
          done

      - name: Tamper check must fail closed
        working-directory: mgnarftest
        env:
          MGTEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          receipt="$(find evidence -maxdepth 1 -type f -name '*.json' | sort | head -n 1)"
          test -n "$receipt"
          cp "$receipt" /tmp/tampered.json
          python3 - <<'PY'
          import json
          p = '/tmp/tampered.json'
          d = json.load(open(p))
          d['target']['commit'] = '0000000000000000000000000000000000000000'
          json.dump(d, open(p, 'w'))
          PY
          if python3 tools/verify_receipt.py /tmp/tampered.json; then
            echo "Tampered receipt was accepted"
            exit 1
          fi
          echo "Tampered receipt rejected as required"

      - name: Upload execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mgnarftest-evidence-${{ github.run_id }}
          path: mgnarftest/evidence/*.json
          if-no-files-found: error
          retention-days: 30
