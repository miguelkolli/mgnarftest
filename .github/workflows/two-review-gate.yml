name: MGnarfTest stable-promotion review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  trusted-promotion-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify trusted base SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"

      - name: Compile trusted trust-root and promotion verifiers
        run: |
          python3 -m py_compile tools/enforce_trust_root.py
          python3 -m py_compile tools/verify_stable_promotion_pr.py

      - name: Enforce current repository trust-root authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.enforce_trust_root

      - name: Verify STABLE promotion using trusted base code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.verify_stable_promotion_pr
