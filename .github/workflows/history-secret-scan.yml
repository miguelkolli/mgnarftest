name: MGnarfTest history secret scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Compile history scanner
        run: python3 -m py_compile tools/scan_git_history_secrets.py

      - name: Scan all fetched Git history for credential material
        run: python3 tools/scan_git_history_secrets.py
